name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.1.7)'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: ''
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    environment: Prod
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync version from git tag
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "Updating version to $VERSION"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const VERSION = process.env.VERSION;
            // tauri.conf.json
            const tc = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            tc.version = VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tc, null, 2) + '\n');
            // package.json
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            // Cargo.toml - replace first version line
            let cargo = fs.readFileSync('src-tauri/Cargo.toml','utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + VERSION + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "
        shell: bash

      - name: Pin linuxdeploy to fix AppImage EGL rendering
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          TAURI_TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TAURI_TOOLS"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage -O "$TAURI_TOOLS/linuxdeploy-x86_64.AppImage"
          chmod +x "$TAURI_TOOLS/linuxdeploy-x86_64.AppImage"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'TerraNova ${{ env.RELEASE_TAG }}'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      - name: Fix AppImage symlinks and repackage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(find src-tauri/target -name '*.AppImage' ! -name '*.sig' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping"
            exit 0
          fi
          echo "Found AppImage: $APPIMAGE"

          # Extract (clean any stale extraction first)
          rm -rf squashfs-root
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          # Fix any broken absolute symlinks in AppDir root
          cd squashfs-root
          find . -maxdepth 1 -type l | while read -r link; do
            if [ ! -e "$link" ]; then
              TARGET=$(readlink "$link")
              echo "Fixing broken symlink: $link -> $TARGET"
              rm "$link"
              BASENAME=$(basename "$TARGET")
              REAL=$(find usr -name "$BASENAME" -type f | head -1)
              if [ -n "$REAL" ]; then
                ln -s "$REAL" "$link"
                echo "  -> $REAL"
              else
                echo "  WARNING: could not find $BASENAME in usr/"
              fi
            fi
          done
          cd ..

          # Repackage with pinned appimagetool (--appimage-extract-and-run
          # avoids libfuse2 dependency on the CI runner)
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous-2024-12-13/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"

          # Re-sign the repackaged AppImage for the Tauri updater.
          # tauri-cli is already installed by the build step.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cargo tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              --file "$APPIMAGE"
            echo "Re-signed: ${APPIMAGE}.sig"
          fi

          # Replace the release assets with the fixed AppImage + signature
          APPIMAGE_NAME=$(basename "$APPIMAGE")
          gh release upload "${{ env.RELEASE_TAG }}" "$APPIMAGE" --clobber
          if [ -f "${APPIMAGE}.sig" ]; then
            gh release upload "${{ env.RELEASE_TAG }}" "${APPIMAGE}.sig" --clobber
          fi

          rm -rf squashfs-root appimagetool

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find src-tauri/target -name "TerraNova.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Verifying signature on: $APP_PATH"
            codesign -dvv "$APP_PATH" 2>&1
            codesign --verify --deep --strict "$APP_PATH" 2>&1 || echo "Warning: Signature verification had issues"
          fi
